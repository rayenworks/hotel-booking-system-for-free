<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Staff and Management Portal - Hotel Room Booking System">
  <title>Staff Login | Hotel Management</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--bg-subtle);">

  <!-- Login Main Content -->
  <main class="login-page-wrap">
    <div class="login-card">
      
      <div class="login-header">
        <a href="/" class="brand-link" style="justify-content: center; margin-bottom: 1.25rem;">
          <div class="brand-logo-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
          </div>
          <span class="brand-title" id="admin-login-hotel-name">Hotel Name</span>
        </a>
        <h1 class="login-title">Staff Portal</h1>
        <p class="text-muted" style="font-size: 0.9rem;">Sign in with your administrator credentials</p>
      </div>

      <!-- Error message container -->
      <div id="login-error-alert" class="alert-box alert-danger" style="display: none; margin-bottom: 1.25rem;" role="alert">
        <span class="icon-wrap" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </span>
        <span id="login-error-text"></span>
      </div>

      <form id="login-form" novalidate>
        
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="admin-email" class="form-label">Email Address</label>
          <input type="email" id="admin-email" name="email" class="input-control" placeholder="admin@hotel.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label for="admin-password" class="form-label">Password</label>
          <input type="password" id="admin-password" name="password" class="input-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
          Sign In
        </button>

      </form>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="/" class="text-muted" style="font-size: 0.85rem; text-decoration: underline;">← Return to Customer Booking</a>
      </div>

    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>

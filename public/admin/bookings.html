<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage hotel guest bookings, reservations, and stay confirmations.">
  <title>Manage Bookings | Hotel Staff Portal</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Admin Navigation -->
  <header class="site-header admin-header">
    <div class="container header-inner">
      <a href="/admin/bookings.html" class="brand-link">
        <div class="brand-logo-icon" style="background: #374151;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
        </div>
        <span class="brand-title" id="admin-nav-hotel-name">Hotel Name</span>
      </a>

      <nav class="header-nav" aria-label="Admin Navigation">
        <a href="/admin/bookings.html" class="nav-link active" id="nav-bookings">Bookings</a>
        <a href="/admin/rooms.html" class="nav-link" id="nav-rooms">Rooms</a>
        <button type="button" class="btn btn-secondary btn-sm" id="admin-logout-btn" style="color: white; border-color: #4b5563; background: transparent;">
          <span class="icon-wrap" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </span>
          Logout
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Management Area -->
  <main class="main-content admin-container">
    <div class="container">
      
      <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.85rem;">Guest Bookings</h1>
        <p class="text-muted">Review incoming requests, verify by phone, and update confirmation statuses.</p>
      </div>

      <!-- Filter Tabs -->
      <nav class="tabs-wrap" aria-label="Booking Status Filter">
        <button type="button" class="tab-btn active" data-status="all">All Bookings</button>
        <button type="button" class="tab-btn" data-status="pending">Pending</button>
        <button type="button" class="tab-btn" data-status="confirmed">Confirmed</button>
        <button type="button" class="tab-btn" data-status="cancelled">Cancelled</button>
      </nav>

      <!-- Bookings Content Container -->
      <div id="bookings-data-wrap">
        
        <!-- Desktop Table View -->
        <div class="table-responsive" id="bookings-table-wrap">
          <table class="data-table" aria-label="Bookings List">
            <thead>
              <tr>
                <th scope="col">Room & Floor</th>
                <th scope="col">Guest Name</th>
                <th scope="col">Phone</th>
                <th scope="col">Check-in</th>
                <th scope="col">Check-out</th>
                <th scope="col">Nights</th>
                <th scope="col">Guests</th>
                <th scope="col">Status</th>
                <th scope="col" style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="bookings-table-body">
              <!-- Rendered by admin-bookings.js -->
            </tbody>
          </table>
        </div>

        <!-- Mobile Cards View -->
        <div class="admin-cards-list" id="bookings-cards-list">
          <!-- Rendered by admin-bookings.js -->
        </div>

      </div>

    </div>
  </main>

  <!-- Confirmation Modal for Actions (e.g. Cancel) -->
  <div id="action-confirm-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-hidden="true">
    <div class="modal-container" style="max-width: 460px;">
      <div class="modal-header">
        <h3 class="modal-title" id="confirm-modal-title">Confirm Action</h3>
        <button type="button" class="modal-close-btn" id="confirm-modal-close" aria-label="Close dialog">
          <span class="icon-wrap" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </span>
        </button>
      </div>
      <div class="modal-body">
        <div id="confirm-modal-message" style="font-size: 0.95rem; line-height: 1.5;"></div>
        <div id="confirm-modal-warning" class="alert-box alert-warning" style="display: none; margin-top: 1rem;">
          <span class="icon-wrap" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </span>
          <span id="confirm-modal-warning-text"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="confirm-modal-cancel-btn">Back</button>
        <button type="button" class="btn btn-danger" id="confirm-modal-proceed-btn">Yes, Cancel Booking</button>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin-bookings.js"></script>
</body>
</html>
